# Serve the SPA + reverse-proxy the two payment wires to the server container:
#   /api/*  — the mppx charge wire (402 challenge → Authorization → receipt)
#   /x402/* — the standalone x402 wire (402 JSON → X-PAYMENT → settle)
# The upstream host `server` is the Compose service name (resolved on the
# shared Docker network); :3001 is its internal PORT.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy. Resolve the upstream at REQUEST time via Docker's
    # embedded DNS (127.0.0.11), NOT once at startup: a literal
    # `proxy_pass http://server:3001` caches the IP when nginx boots,
    # which races container start order (intermittent 502 on cold start) and
    # goes stale if the server restarts with a new IP. Using a variable in
    # proxy_pass forces per-request re-resolution. `$request_uri` carries the
    # full original path+query (e.g. /api/premium?x=1) through unchanged.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mpp_server http://server:3001;
        proxy_pass $mpp_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass the real client IP through so any per-caller throttling keys
        # off the caller, not the proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The standalone x402 route (b402 permit2-exact) — same proxy rules.
    location /x402/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mpp_server http://server:3001;
        proxy_pass $mpp_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — client-side routing serves index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
