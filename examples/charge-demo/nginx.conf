# Serve the SPA + reverse-proxy /api/* to the charge-server container.
# The upstream host `charge-server` is the Compose service name (resolved on
# the shared Docker network); :3000 is its internal PORT.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy. Resolve the upstream at REQUEST time via Docker's
    # embedded DNS (127.0.0.11), NOT once at startup: a literal
    # `proxy_pass http://charge-server:3000` caches the IP when nginx boots,
    # which races container start order (intermittent 502 on cold start) and
    # goes stale if charge-server restarts with a new IP. Using a variable in
    # proxy_pass forces per-request re-resolution. `$request_uri` carries the
    # full original path+query (e.g. /api/tip?amount=1) through unchanged.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $charge_server http://charge-server:3000;
        proxy_pass $charge_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # charge-server's rate limiter keys off X-Forwarded-For — pass the
        # real client IP through so throttling is per-caller, not per-proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — client-side routing serves index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
