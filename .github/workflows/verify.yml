name: verify

on:
  pull_request:
    branches: [main, v1]
  # Reused as the pre-publish gate by release.yml (pushes to v1 run verify
  # through that call, so there is no separate `push` trigger here — it
  # would double-run every job on release pushes).
  workflow_call: {}

# Cancel in-flight runs for the same branch when a new push arrives.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-regression guard reads package.json from the PR base.
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      - name: Test release guards
        run: node --test .github/scripts/check-version-regression.test.mjs
      - name: Reject package version regressions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-version-regression.mjs "$BASE_SHA"
      - name: Lint + fmt check
        run: pnpm check:ci

  types:
    name: tsgo type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Type check (tsgo -b + test config)
        run: pnpm check:types

  test:
    name: unit + interop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Run unit + interop projects
        # `live` project is excluded — it requires testnet RPC + signing
        # keys that don't belong in CI secrets for this stage. Live tests
        # gate manually via `pnpm test -- --project live` from a workstation
        # with the right env vars (see test/live/*.test.ts headers).
        #
        # NOTE: do NOT insert a `--` separator before the flags. pnpm 11
        # forwards `--` literally to the script, and `vp test` (vitest CLI)
        # treats everything after a literal `--` as positional test-name
        # filters — the `--project` and `--coverage` flags would be
        # silently IGNORED (all projects run, live self-skips, coverage
        # off). Verified on pnpm@11.0.8: bare flags after the script name
        # forward verbatim and are parsed as real flags.
        #
        # Coverage enforcement: @vitest/coverage-v8 provider with the
        # thresholds configured in vite.config.ts (70% statements /
        # branches / functions). The run fails if coverage drops below
        # them (current: ~92% stmts / ~81% branch on unit + interop).
        run: pnpm test --project unit --project interop --coverage.enabled=true

  build:
    name: zile build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - name: Build dist/
        run: pnpm build
