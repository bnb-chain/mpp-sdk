name: release

# Changesets-driven release pipeline (mirrors mppx commit 5aed74b
# `.github/workflows/main.yml`, adapted to this repo's release branches).
#
# On every push to main (and the legacy v1 release branch):
#   1. `verify` re-runs the full CI gate (lint/types/tests/build) via
#      workflow_call — a release can never outrun a red branch.
#   2. `changesets` either:
#      - opens/updates the "chore: version package" PR when unreleased
#        changesets exist (runs `pnpm changeset:version`), or
#      - publishes to npm + creates the git tag and GitHub Release when
#        that PR has just been merged (runs `pnpm changeset:publish`,
#        i.e. `zile publish:prepare && changeset publish && zile publish:post`).
#
# npm auth uses OIDC trusted publishing (no long-lived token): configure
# GitHub Actions as a Trusted Publisher on the npm package
# (repo `bnb-chain/mpp-sdk`, workflow `release.yml`), which also makes npm
# generate provenance attestations. Setup + first-publish bootstrap:
# docs/releasing.md.

on:
  push:
    branches: [v1, main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to bump'
        type: choice
        options: ['all', '@bnb-chain/mpp', '@bnb-chain/b402', '@bnb-chain/mpp-b402']
        default: 'all'
        required: true
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions: {}

# Queue (never cancel) overlapping release runs: cancelling mid-publish
# could leave npm published but the git tag / GitHub Release missing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  changesets:
    name: version PR or npm publish
    # Guard forks: publishing only ever runs from the canonical repo.
    # Manual recovery runs are accepted from main only; choosing another ref
    # in the workflow UI must never create a release from a feature branch.
    if: >-
      github.repository == 'bnb-chain/mpp-sdk' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # version-PR commits, git tags, GitHub Releases
      id-token: write # npm OIDC trusted publishing + provenance
      pull-requests: write # open/update the version PR
    steps:
      - uses: actions/checkout@v4
        with:
          # The changesets action authenticates with GITHUB_TOKEN below;
          # don't leave the default credential in .git/config.
          persist-credentials: false

      - uses: ./.github/actions/install-dependencies

      # A manual dispatch is a recovery seam for a consumed/missing changeset.
      # It still creates a reviewable version PR; publishing happens only after
      # that PR is merged and the normal push workflow runs.
      - name: Create manual release changeset
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: |
          if git ls-files '.changeset/*.md' | grep -qv '^.changeset/README.md$'; then
            echo '::error title=Pending changeset::Merge the existing changeset through the normal release flow instead of adding a manual bump.'
            exit 1
          fi

          case "$RELEASE_BUMP" in
            patch|minor|major) ;;
            *) echo '::error title=Invalid bump::Expected patch, minor, or major.'; exit 1 ;;
          esac

          case "$RELEASE_PACKAGE" in
            all) RELEASE_PACKAGES=('@bnb-chain/mpp' '@bnb-chain/b402' '@bnb-chain/mpp-b402') ;;
            '@bnb-chain/mpp'|'@bnb-chain/b402'|'@bnb-chain/mpp-b402')
              RELEASE_PACKAGES=("$RELEASE_PACKAGE")
              ;;
            *) echo '::error title=Invalid package::Unknown release package.'; exit 1 ;;
          esac

          {
            echo '---'
            for package_name in "${RELEASE_PACKAGES[@]}"; do
              echo "'$package_name': $RELEASE_BUMP"
            done
            echo '---'
            echo
            echo 'Manual release recovery.'
          } > .changeset/manual-release.md

      # Node 22 bundles npm 10.x, but `changeset publish` shells out to
      # `npm publish`, and OIDC trusted publishing requires npm >= 11.5.1.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install --global npm@11

      - name: Build dist/
        run: pnpm build

      - name: Version PR or publish
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          title: 'chore: version package'
          commit: 'chore: version package'
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token fallback (only if Trusted Publishing is not configured):
          # add an npm granular access token with publish rights on
          # @bnb-chain/mpp as the NPM_TOKEN repo secret and uncomment:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_CONFIG_PROVENANCE: true
