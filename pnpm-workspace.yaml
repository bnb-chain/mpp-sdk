packages:
  - .
  - examples/*

strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
# trustPolicy: no-downgrade
#   TEMPORARILY relaxed for the boot install — tinyexec@1.2.x transitioned
#   from "trusted publisher" to "provenance attestation" mid-week and pnpm
#   flags any such transition as a downgrade, blocking install before any
#   override is applied. After the first lockfile lands and we manually vet
#   the resolved versions, RE-ENABLE this line and resolve via lockfile pin
#   or per-package allowlist (TODO: file PR1 follow-up task).

# Mirrors mppx's overrides (commit 5aed74b). Each pin justified upstream:
#   - ox 0.14.24      : forces registry resolution (viem 2.51.0 ships a
#                       pkg.pr.new URL pin for ox; blockExoticSubdeps rejects).
#   - viem ^2.51.0    : peer floor required by mppx ≥0.6.28.
#   - fast-uri 3.1.2  : CVE patch (see mppx-aligned baseline).
overrides:
  ox: '0.14.24'
  viem: '^2.51.0'
  fast-uri@<=3.1.1: '^3.1.2'
  # vp ships vp-test as the actual vitest runtime; rewire the `vitest`
  # package specifier so user code (vp's generated shim, our tests) can
  # `import { ... } from 'vitest'` and resolve to vp-test. Mirrors mppx.
  vitest: 'npm:@voidzero-dev/vite-plus-test@~0.1.17'

# Version-pinned release-age exemptions — bypass the 24h gate only for
# the exact version we've manually vetted. Use `package@version` form so
# a future unvetted bump still gets gated.
minimumReleaseAgeExclude:
  - fast-uri@3.1.2
  - ox@0.14.24
  - viem@2.51.0

nodeOptions: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

allowBuilds:
  bufferutil: set this to true or false
  esbuild: true
  keccak: set this to true or false
  utf-8-validate: set this to true or false
