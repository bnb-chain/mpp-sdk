packages:
  - .
  - packages/*
  - examples/*

strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
#   Re-enabled (audit I01) now that the lockfile has landed and the
#   tinyexec@1.2.2 resolution is pinned + vetted. `no-downgrade` detects a
#   sudden drop in a dependency's trust signal (a supply-chain-compromise
#   indicator); resolve any remaining exceptions via lockfile pin or a
#   per-package allowlist rather than disabling this workspace-wide.

# Runtime pins validated with mppx 0.8.12 (commit b4334f0):
#   - ox 0.14.30      : common version used by mppx 0.8.12 and viem 2.55.x.
#   - viem ^2.54.0    : peer floor required by mppx 0.8.12.
#   - fast-uri 3.1.2  : CVE patch (see mppx-aligned baseline).
overrides:
  ox: '0.14.30'
  viem: '^2.54.0'
  fast-uri@<=3.1.1: '^3.1.2'
  # vp ships vp-test as the actual vitest runtime; rewire the `vitest`
  # package specifier so user code (vp's generated shim, our tests) can
  # `import { ... } from 'vitest'` and resolve to vp-test. Mirrors mppx.
  vitest: 'npm:@voidzero-dev/vite-plus-test@~0.1.17'

# Version-pinned release-age exemptions — bypass the 24h gate only for
# the exact version we've manually vetted. Use `package@version` form so
# a future unvetted bump still gets gated.
minimumReleaseAgeExclude:
  - fast-uri@3.1.2
  - ox@0.14.30

nodeOptions: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

# Explicit per-package build-script decisions (strictDepBuilds requires
# every native dep to be decided; a fresh CI install fails on any
# undecided entry).
#   - bufferutil / utf-8-validate: optional ws perf addons — ws falls
#     back to its JS implementations when the bindings are absent.
#   - keccak: transitive via the example client's wagmi → @coinbase/wallet-sdk;
#     browser-bundled there and ships a pure-JS fallback.
# None of the three needs its native build, so CI stays node-gyp-free.
allowBuilds:
  bufferutil: false
  esbuild: true
  keccak: false
  utf-8-validate: false
